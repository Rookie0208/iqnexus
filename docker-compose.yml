version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: iqnexus-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=Epoch-olympiad-foundation_New
    networks:
      - iqnexus-network

  # Backend API
  backend:
    build:
      context: ./iqnexus-backend-main
      dockerfile: Dockerfile
    container_name: iqnexus-backend
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/Epoch-olympiad-foundation_New
      - DATABASE_NAME=Epoch-olympiad-foundation_New
      - AWS_KEY=
      - AWS_SECRET=
      - AWS_REGION=ap-south-1
      - AWS_BUCKET_NAME=epocho-1

    depends_on:
      - mongodb
    networks:
      - iqnexus-network
    volumes:
      - ./iqnexus-backend-main:/app
      - /app/node_modules

  # Client Application
  client:
    build:
      context: ./iqnexus-client-main
      dockerfile: Dockerfile
    container_name: iqnexus-client
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - REACT_APP_BASE_API_URL=https://iqnexus.jayantasonowal.com/api
    depends_on:
      - backend
    networks:
      - iqnexus-network
    volumes:
      - ./iqnexus-client-main:/app
      - /app/node_modules

  # Admin Application
  admin:
    build:
      context: ./iqnexus-admin-main
      dockerfile: Dockerfile
    container_name: iqnexus-admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    expose:
      - "3000"
    environment:
      - VITE_BASE_API_URL=https://iqnexus.jayantasonowal.com/api
    depends_on:
      - backend
    networks:
      - iqnexus-network
    volumes:
      - ./iqnexus-admin-main:/app
      - /app/node_modules

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: iqnexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - client
      - admin
    networks:
      - iqnexus-network

networks:
  iqnexus-network:
    driver: bridge

volumes:
  mongodb_data:
