name: CI

on:
  pull_request:
    branches: [main, master, deploy]
  push:
    branches: [main, master, deploy]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build production package
        run: bash aws-deploy/package.sh
